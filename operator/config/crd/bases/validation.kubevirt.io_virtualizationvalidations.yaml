                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              executions:
                description: Executions is the bounded projection of CTRF check executions.
                items:
                  description: |-
                    VirtualizationValidationExecution is one observed execution of a logical
                    validation check. Consumers group related executions by CheckID.
                  properties:
                    checkId:
                      description: CheckID is a stable, profile-independent identifier
                        defined by VCV.
                      maxLength: 128
                      type: string
                    completedAt:
                      description: CompletedAt is when this execution completed, when
                        reported by CTRF.
                      format: date-time
                      type: string
                    durationMilliseconds:
                      description: DurationMilliseconds is the execution duration
                        reported by CTRF.
                      format: int64
                      type: integer
                    executionId:
                      description: ExecutionID distinguishes repeated executions of
                        the same check.
                      maxLength: 128
                      type: string
                    flaky:
                      description: Flaky is reported by CTRF when retries produced
                        different outcomes.
                      type: boolean
                    message:
                      description: Message is a bounded human-readable execution result.
                      maxLength: 512
                      type: string
                    name:
                      description: Name is a human-readable check name.
                      maxLength: 256
                      type: string
                    outcome:
                      description: Outcome is the observed result state.
                      enum:
                      - Pending
                      - Running
                      - Passed
                      - Failed
                      - TimedOut
                      - Error
                      - Skipped
                      - Cancelled
                      type: string
                    parameters:
                      additionalProperties:
                        type: string
                      description: Parameters contains bounded execution inputs and
                        observed properties.
                      maxProperties: 16
                      type: object
                    parametersTruncated:
                      description: ParametersTruncated reports that some parameter
                        information was omitted.
                      type: boolean
                    reason:
                      description: |-
                        Reason is a stable machine-readable outcome reason, such as
                        ExecutionTimedOut or SnapshotTimedOut.
                      maxLength: 128
                      type: string
                    representative:
                      description: |-
                        Representative reports that this execution is retained as an exemplar for
                        otherwise collapsed executions.
                      type: boolean
                    retryCount:
                      description: RetryCount is the number of retries reported by
                        CTRF.
                      format: int32
                      type: integer
                    severity:
                      description: Severity controls this execution's contribution
                        to the verdict.
                      enum:
                      - Required
                      - Advisory
                      type: string
                    startedAt:
                      description: StartedAt is when this execution started, when
                        reported by CTRF.
                      format: date-time
                      type: string
                    steps:
                      description: Steps is the bounded workflow-step projection.
                      items:
                        description: ValidationStep is one bounded CTRF step observed
                          within an execution.
                        properties:
                          extra:
                            additionalProperties:
                              type: string
                            description: Extra contains bounded runner-provided step
                              metadata.
                            maxProperties: 16
                            type: object
                          extraTruncated:
                            description: ExtraTruncated reports that some metadata
                              was omitted.
                            type: boolean
                          name:
                            description: Name is the human-readable workflow step
                              name.
                            maxLength: 256
                            type: string
                          outcome:
                            description: Outcome is the observed step state.
                            enum:
                            - Pending
                            - Running
                            - Passed
                            - Failed
                            - TimedOut
                            - Error
                            - Skipped
                            - Cancelled
                            type: string
                          reason:
                            description: Reason is a machine-readable step outcome
                              reason.
                            maxLength: 128
                            type: string
                        required:
                        - name
                        - outcome
                        type: object
                      maxItems: 16
                      type: array
                    stepsTruncated:
                      description: StepsTruncated reports that some workflow steps
                        were omitted.
                      type: boolean
                    subject:
                      description: Subject identifies the target scope of this execution.
                      properties:
                        apiGroup:
                          description: APIGroup is the subject API group when applicable.
                          type: string
                        kind:
                          description: Kind is the subject kind.
                          type: string
                        name:
                          description: Name is the subject name.
                          type: string
                        namespace:
                          description: Namespace is the subject namespace when applicable.
                          type: string
                      required:
                      - kind
                      - name
                      type: object
                  required:
                  - checkId
                  - name
                  - outcome
                  - severity
                  type: object
                maxItems: 128
                type: array
              image:
                description: Image is the validator image used for the run.
                type: string
              jobName:
                description: JobName is the controller-owned validator Job.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation used to calculate
                  this status.
                format: int64
                type: integer
              observedInputHash:
                description: ObservedInputHash identifies the immutable run inputs.
                type: string
              observedReportResourceVersion:
                description: ObservedReportResourceVersion is the last consumed report
                  snapshot.
                type: string
              phase:
                description: Phase is the controller lifecycle state.
                enum:
                - Pending
                - Running
                - Completed
                - Cancelled
                - Error
                type: string
              queuedAt:
                description: QueuedAt is when the request first began waiting for
                  the target lease.
                format: date-time
                type: string
              reduction:
                description: Reduction describes information removed from the status
                  projection.
                properties:
                  advisoryFailuresOmitted:
                    description: AdvisoryFailuresOmitted is the number of advisory
                      failures omitted from detail.
                    format: int32
                    type: integer
                  advisoryInconclusiveOmitted:
                    description: |-
                      AdvisoryInconclusiveOmitted is the number of advisory timed out, skipped,
                      cancelled, or errored executions omitted from detail.
                    format: int32
                    type: integer
                  level:
                    description: |-
                      Level is the highest reduction rung applied, from 0 (none) through 7
                      (summary only).
                    format: int32
                    maximum: 7
                    minimum: 0
                    type: integer
                  passedCollapsed:
                    description: PassedCollapsed is the number of passed executions
                      omitted from detail.
                    format: int32
                    type: integer
                  pendingCollapsed:
                    description: PendingCollapsed is the number of pending executions
                      omitted from detail.
                    format: int32
                    type: integer
                  requiredFailuresOmitted:
                    description: RequiredFailuresOmitted is the number of required
                      failures omitted from detail.
                    format: int32
                    type: integer
                  requiredInconclusiveOmitted:
                    description: |-
                      RequiredInconclusiveOmitted is the number of required timed out, skipped,
                      cancelled, or errored executions omitted from detail.
                    format: int32
                    type: integer
                  totalExecutions:
                    description: TotalExecutions is the total number of executions
                      before reduction.
                    format: int32
                    type: integer
                type: object
              report:
                description: Report identifies the observed CTRF document.
                properties:
                  digest:
                    description: Digest is the SHA-256 digest of the observed artifact
                      content.
                    type: string
                  reduction:
                    description: Reduction describes information removed from the
                      retained CTRF artifact.
                    properties:
                      advisoryFailuresOmitted:
                        description: AdvisoryFailuresOmitted is the number of advisory
                          failures omitted from detail.
                        format: int32
                        type: integer
                      advisoryInconclusiveOmitted:
                        description: |-
                          AdvisoryInconclusiveOmitted is the number of advisory timed out, skipped,
                          cancelled, or errored executions omitted from detail.
                        format: int32
                        type: integer
                      level:
                        description: |-
                          Level is the highest reduction rung applied, from 0 (none) through 7
                          (summary only).
                        format: int32
                        maximum: 7
                        minimum: 0
                        type: integer
                      passedCollapsed:
                        description: PassedCollapsed is the number of passed executions
                          omitted from detail.
                        format: int32
                        type: integer
                      pendingCollapsed:
                        description: PendingCollapsed is the number of pending executions
                          omitted from detail.
                        format: int32
                        type: integer
                      requiredFailuresOmitted:
                        description: RequiredFailuresOmitted is the number of required
                          failures omitted from detail.
                        format: int32
                        type: integer
                      requiredInconclusiveOmitted:
                        description: |-
                          RequiredInconclusiveOmitted is the number of required timed out, skipped,
                          cancelled, or errored executions omitted from detail.
                        format: int32
                        type: integer
                      totalExecutions:
                        description: TotalExecutions is the total number of executions
                          before reduction.
                        format: int32
                        type: integer
                    type: object
                  specVersion:
                    description: SpecVersion is the CTRF specification version.
                    type: string
                type: object
              reportComplete:
                description: ReportComplete reports whether CTRF has no pending executions.
                type: boolean
              startedAt:
                description: StartedAt is when the controller created the validator
                  Job.
                format: date-time
                type: string
              summary:
                description: Summary contains aggregate CTRF counters.
                properties:
                  failed:
                    description: Failed is the number of failed executions.
                    format: int32
                    type: integer
                  other:
                    description: Other is the number of CTRF executions with an unclassified
                      result.
                    format: int32
                    type: integer
                  passed:
                    description: Passed is the number of passed executions.
                    format: int32
                    type: integer
                  pending:
                    description: Pending is the number of executions not yet complete.
                    format: int32
                    type: integer
                  skipped:
                    description: Skipped is the number of skipped executions.
                    format: int32
                    type: integer
                  total:
                    description: Total is the number of executions in the report.
                    format: int32
                    type: integer
                type: object
              verdict:
                description: Verdict is the aggregate validation interpretation.
                enum:
                - Unknown
                - Valid
                - ValidWithWarnings
                - Invalid
                - Inconclusive
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
