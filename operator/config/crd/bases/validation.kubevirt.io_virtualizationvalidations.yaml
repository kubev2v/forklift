---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: virtualizationvalidations.validation.kubevirt.io
spec:
  group: validation.kubevirt.io
  names:
    kind: VirtualizationValidation
    listKind: VirtualizationValidationList
    plural: virtualizationvalidations
    shortNames:
    - vcv
    singular: virtualizationvalidation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Target API endpoint
      jsonPath: .spec.target.url
      name: Target
      type: string
    - description: Validation profile
      jsonPath: .spec.run.profile
      name: Profile
      type: string
    - description: Validation phase
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: Validation verdict
      jsonPath: .status.verdict
      name: Verdict
      type: string
    - description: Checks passed
      jsonPath: .status.summary.passed
      name: Passed
      type: integer
    - description: Checks failed
      jsonPath: .status.summary.failed
      name: Failed
      type: integer
    - description: Time since validation was created
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          VirtualizationValidation requests one immutable remote-cluster validation.
          Invalid configuration enters Error and must be deleted and recreated after it is corrected.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              run:
                description: Run configures this immutable validation execution.
                properties:
                  cancel:
                    default: false
                    description: |-
                      Cancel requests one-way cancellation of this validation. A cancelled
                      validation cannot be resumed; create a new resource to run it again.
                    type: boolean
                  cleanupPolicy:
                    default: Always
                    description: |-
                      CleanupPolicy controls retention of target workload resources created by
                      validation checks. Controller-owned Job and report resources are unaffected.
                    enum:
                    - Always
                    - OnFailure
                    - Never
                    type: string
                  executionTimeoutSeconds:
                    default: 180
                    description: |-
                      ExecutionTimeoutSeconds limits one profile execution, such as one canary
                      VM on one target node.
                    format: int64
                    maximum: 3600
                    minimum: 1
                    type: integer
                  id:
                    default: initial
                    description: |-
                      ID is an optional caller-chosen execution identity. Changing it starts a
                      new run without deleting and recreating this resource.
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  maxConcurrentExecutions:
                    description: |-
                      MaxConcurrentExecutions limits concurrent profile execution units. When
                      omitted, the executor uses its own default.
                    format: int32
                    maximum: 64
                    minimum: 1
                    type: integer
                  profile:
                    description: |-
                      Profile is a versioned validation suite. The current controller supports
                      basic-v1 and basic-all-nodes-v1, which verify authentication, CNV
                      installation, validation namespace quota, and canary VM workflows.
                    pattern: ^[a-z][a-z0-9-]*-v[0-9]+$
                    type: string
                  queueTimeoutSeconds:
                    default: 0
                    description: |-
                      QueueTimeoutSeconds limits how long this request may wait for the
                      target-scoped lease. Zero uses the suite timeout.
                    format: int64
                    maximum: 86400
                    minimum: 0
                    type: integer
                  suiteTimeoutSeconds:
                    default: 900
                    description: |-
                      SuiteTimeoutSeconds limits the entire validation Job, including all
                      profile executions.
                    format: int64
                    maximum: 86400
                    minimum: 1
                    type: integer
                required:
                - profile
                type: object
                x-kubernetes-validations:
                - message: executionTimeoutSeconds must not exceed suiteTimeoutSeconds
                  rule: self.executionTimeoutSeconds <= self.suiteTimeoutSeconds
              target:
                description: Target is the remote cluster connection request.
                properties:
                  credentialsSecret:
                    description: CredentialsSecret supplies target authentication
                      and optional CA data.
                    properties:
                      caKey:
                        description: |-
                          CAKey identifies the CA entry in the Secret. Omit it or set it to an empty
                          string to use the container system trust store instead.
                        type: string
                      name:
                        description: Name is the same-namespace Secret name.
                        minLength: 1
                        type: string
                      tokenKey:
                        default: token
                        description: TokenKey identifies the bearer-token entry in
                          the Secret.
                        type: string
                    required:
                    - name
                    type: object
                  identity:
                    description: Identity is descriptive metadata for users and consumers.
                    properties:
                      displayName:
                        description: DisplayName is a human-readable target name.
                        type: string
                      id:
                        description: ID is a caller-provided stable target identifier.
                        type: string
                    type: object
                  insecureSkipTLS:
                    description: |-
                      InsecureSkipTLS disables target certificate verification. Use only for
                      short-lived troubleshooting; prefer CAKey or system trust.
                    type: boolean
                  toolDownloads:
                    description: ToolDownloads optionally overrides target CLI discovery.
                    properties:
                      clusterDomain:
                        description: |-
                          ClusterDomain is the target ingress domain used only when an explicit
                          download URL is not supplied.
                        maxLength: 253
                        type: string
                      ocURL:
                        description: OCURL is the HTTPS archive URL for the target-compatible
                          oc client.
                        maxLength: 2048
                        pattern: ^https://
                        type: string
                      virtctlURL:
                        description: VirtctlURL is the HTTPS archive URL for target-compatible
                          virtctl.
                        maxLength: 2048
                        pattern: ^https://
                        type: string
                    type: object
                  url:
                    description: URL is the absolute HTTPS API endpoint for the target
                      cluster.
                    maxLength: 2048
                    minLength: 1
                    pattern: ^https://
                    type: string
                required:
                - credentialsSecret
                - url
                type: object
              workload:
                description: Workload defines target resources required by the selected
                  profile.
                properties:
                  dataSource:
                    description: DataSource is used to create the validation canary
                      VM.
                    properties:
                      apiGroup:
                        default: cdi.kubevirt.io
                        description: APIGroup is the API group of the referenced data
                          source.
                        type: string
                      kind:
                        default: DataSource
                        description: Kind is the kind of the referenced data source.
                        type: string
                      name:
                        description: Name is the data source name.
                        maxLength: 63
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                      namespace:
                        description: Namespace contains the data source.
                        maxLength: 63
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  namespace:
                    description: Namespace is where validation canary resources are
                      created on the target.
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - dataSource
                - namespace
                type: object
            required:
            - run
            - target
            - workload
            type: object
            x-kubernetes-validations:
            - message: VirtualizationValidation spec is immutable except that run.id
                may change or run.cancel may be set to true
              rule: self == oldSelf || (self.target == oldSelf.target && self.workload
                == oldSelf.workload && self.run.profile == oldSelf.run.profile &&
                self.run.suiteTimeoutSeconds == oldSelf.run.suiteTimeoutSeconds &&
                self.run.executionTimeoutSeconds == oldSelf.run.executionTimeoutSeconds
                && self.run.cleanupPolicy == oldSelf.run.cleanupPolicy && has(self.run.maxConcurrentExecutions)
                == has(oldSelf.run.maxConcurrentExecutions) && (!has(self.run.maxConcurrentExecutions)
                || self.run.maxConcurrentExecutions == oldSelf.run.maxConcurrentExecutions)
                && has(self.run.queueTimeoutSeconds) == has(oldSelf.run.queueTimeoutSeconds)
                && (!has(self.run.queueTimeoutSeconds) || self.run.queueTimeoutSeconds
                == oldSelf.run.queueTimeoutSeconds) && ((has(self.run.id) != has(oldSelf.run.id))
                || (has(self.run.id) && self.run.id != oldSelf.run.id) || ((!has(oldSelf.run.cancel)
                || !oldSelf.run.cancel) && self.run.cancel)))
          status:
            description: VirtualizationValidationStatus is the controller-owned observed
              state.
            properties:
              artifact:
                description: Artifact locates the retained CTRF document.
                properties:
                  apiVersion:
                    description: APIVersion is the artifact API version.
                    type: string
                  key:
                    description: Key is the ConfigMap data key containing the CTRF
                      document.
                    type: string
                  kind:
                    description: Kind is the artifact resource kind.
                    type: string
                  name:
                    description: Name is the artifact resource name.
                    type: string
                  namespace:
                    description: Namespace is the artifact resource namespace.
                    type: string
                  truncated:
                    description: Truncated reports whether the retained artifact was
                      reduced.
                    type: boolean
                required:
                - apiVersion
                - key
                - kind
                - name
                - namespace
                type: object
              completedAt:
                description: CompletedAt is when the lifecycle entered a terminal
