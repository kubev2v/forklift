---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: copyappliances.forklift.konveyor.io
spec:
  group: forklift.konveyor.io
  names:
    kind: CopyAppliance
    listKind: CopyApplianceList
    plural: copyappliances
    singular: copyappliance
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          CopyAppliance is the Schema for API which causes copy appliances to be created
          in source hypervisors to facilitate disk transfer.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CopyAppliance specification.

              The appliance VM is a clone of Template, named after the CopyAppliance
              itself, and that name is how an operator recognizes the VM in the vSphere
              inventory. The controller finds it again by the moRef recorded in the status.
            properties:
              attachDisks:
                description: |-
                  Disks to attach to the appliance VM for export. Each entry names an
                  existing VMDK and carries the VMware identifiers needed to correlate
                  guest exports with source inventory. Empty means disks should be
                  detached (release); non-empty means they should be attached and
                  exporting. Changing the set while terminal re-enters the export
                  itinerary.
                  Capped so that the root disk plus the attached disks fit within the
                  four SCSI controllers vSphere permits per VM (4 x 15 addressable
                  units = 60 disks).
                items:
                  description: AttachedDisk is an existing VMDK to attach to the copy
                    appliance.
                  properties:
                    capacity:
                      description: Disk capacity in bytes. Used as a secondary match
                        key when serial is empty.
                      format: int64
                      type: integer
                    diskKey:
                      description: VMware virtual device key from inventory.
                      format: int32
                      type: integer
                    serial:
                      description: backing.Uuid from inventory. Used to match guest
                        exports.
                      type: string
                    vmdkPath:
                      description: Datastore path of the VMDK (e.g. "[datastore13]
                        some-vm/disk-0.vmdk").
                      pattern: ^\[[^\]]+\]\s*.+\.vmdk$
                      type: string
                  required:
                  - vmdkPath
                  type: object
                maxItems: 59
                type: array
              containerImage:
                description: |-
                  Fully qualified pull spec for the container image loaded into the
                  appliance's podman store. A setup pod reads the image and streams it to
                  the appliance over SSH, so the appliance needs no registry access of its
                  own. The pod carries no credential, so the image has to be readable
                  without one.
                minLength: 1
                type: string
              datacenter:
                description: Datacenter in which the appliance VM is created.
                type: string
              datastore:
                description: Datastore that holds the appliance VM home directory.
                type: string
              folder:
                description: Inventory folder in which the appliance VM is created.
                type: string
              provider:
                description: Source provider in which the appliance VM is created.
                properties:
                  apiVersion:
                    description: API version of the referent.
                    type: string
                  fieldPath:
                    description: |-
                      If referring to a piece of an object instead of an entire object, this string
                      should contain a valid JSON/Go field access statement, such as desiredState.manifest.containers[2].
                      For example, if the object reference is to a container within a pod, this would take on a value like:
                      "spec.containers{name}" (where "name" refers to the name of the container that triggered
                      the event) or if no container name is specified "spec.containers[2]" (container with
                      index 2 in this pod). This syntax is chosen only to have some well-defined way of
                      referencing a part of an object.
                    type: string
                  kind:
                    description: |-
                      Kind of the referent.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                    type: string
                  name:
                    description: |-
                      Name of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
                    type: string
                  resourceVersion:
                    description: |-
                      Specific resourceVersion to which this reference is made, if any.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency
                    type: string
                  uid:
                    description: |-
                      UID of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#uids
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              resourcePool:
                description: Resource pool in which the appliance VM is created.
                minLength: 1
                type: string
              secret:
                description: |-
                  Secret holding everything the controller reaches the appliance with.
                  Name is required; Namespace defaults to the CopyAppliance namespace.

                  The SSH private key is read from the "private-key" data key; the matching
                  public key is expected to be installed in the appliance image already.

                  The mutual-TLS material the appliance serves its exports with is read from
                  the data keys named for the files the appliance expects (see
                  pkg/nbd-container/announce). The controller installs the CA and the
                  server half on the appliance and keeps the client half to query the
                  exports with.

                  The server certificate must be issued for the logical name "nbd-server"
                  rather than for an address. The appliance is cloned on demand and its
                  address is not known when the certificate is issued, so the client
                  verifies the name instead of where it reached it.
                properties:
                  apiVersion:
                    description: API version of the referent.
                    type: string
                  fieldPath:
                    description: |-
                      If referring to a piece of an object instead of an entire object, this string
                      should contain a valid JSON/Go field access statement, such as desiredState.manifest.containers[2].
                      For example, if the object reference is to a container within a pod, this would take on a value like:
                      "spec.containers{name}" (where "name" refers to the name of the container that triggered
                      the event) or if no container name is specified "spec.containers[2]" (container with
                      index 2 in this pod). This syntax is chosen only to have some well-defined way of
                      referencing a part of an object.
                    type: string
                  kind:
                    description: |-
                      Kind of the referent.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                    type: string
                  name:
                    description: |-
                      Name of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
                    type: string
                  resourceVersion:
                    description: |-
                      Specific resourceVersion to which this reference is made, if any.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency
                    type: string
                  uid:
                    description: |-
                      UID of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#uids
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              template:
                description: |-
                  Inventory path of the VM template the appliance is cloned from. The
                  template supplies the root disk, so it must support the controller its
                  disks are attached to, and the one network the appliance is reached on,
                  which the clone inherits as-is.
                minLength: 1
                type: string
            required:
            - containerImage
            - datastore
            - folder
            - provider
            - resourcePool
            - secret
            - template
            type: object
          status:
            description: CopyAppliance status.
            properties:
              addresses:
                description: |-
                  The addresses the appliance VM's guest reports on its network, one entry
                  per address, in the order the guest reports them. Empty until the guest
                  has booted far enough to answer.
                items:
                  description: |-
                    ApplianceAddress is an address the appliance VM's guest reports on its
                    network adapter. The template gives the appliance one network, and an adapter
                    can hold more than one address on it.
                  properties:
                    ip:
                      description: IP address.
                      type: string
                    mac:
                      description: MAC address of the adapter.
                      type: string
                    network:
                      description: Name of the portgroup the guest reports the adapter
                        is attached to.
                      type: string
                  required:
                  - ip
                  - mac
                  - network
                  type: object
                type: array
              conditions:
                description: List of conditions.
                items:
                  description: Condition
                  properties:
                    category:
                      description: The condition category.
                      type: string
                    durable:
                      description: The condition is durable - never un-staged.
                      type: boolean
                    items:
                      description: A list of items referenced in the `Message`.
                      items:
                        type: string
                      type: array
                    lastTransitionTime:
                      description: When the last status transition occurred.
                      format: date-time
                      type: string
                    message:
                      description: The human readable description of the condition.
                      type: string
                    reason:
                      description: The reason for the condition or transition.
                      type: string
                    status:
                      description: The condition status [true,false].
                      type: string
                    suggestion:
                      description: A suggested action or resolution for the condition.
                      type: string
                    type:
                      description: The condition type.
                      type: string
                  required:
                  - category
                  - lastTransitionTime
                  - status
                  - type
                  type: object
                type: array
              exporterImage:
                description: |-
                  The digest-tagged reference the container image is loaded under in the
                  appliance's podman store. The orchestrator unit is rendered to run it.
                type: string
              exports:
                description: |-
                  The disk exports the appliance publishes, one per attached disk. Empty
                  until the appliance is serving all of them.
                items:
                  description: ApplianceExport is one disk the appliance publishes
                    over NBD.
                  properties:
                    device:
                      description: Device node the export reads, as the appliance's
                        guest sees it.
                      type: string
                    diskKey:
                      description: VMware virtual device key of the attached source
                        disk.
                      format: int32
                      type: integer
                    port:
                      description: Port on the appliance the export is served on.
                      format: int32
                      type: integer
                    sourceSerial:
                      description: backing.Uuid of the attached source disk from inventory.
                      type: string
                    vmdkPath:
                      description: Datastore path of the attached source VMDK.
                      type: string
                    wwid:
                      description: |-
                        Stable identifier the appliance's guest resolved for the disk. It falls
                        back to the device path when the guest can report nothing better.
                      type: string
                  required:
                  - device
                  - port
                  - wwid
                  type: object
                type: array
              moRef:
                description: The managed object reference ID of the created appliance
                  VM.
                type: string
              phase:
                description: |-
                  Current deploy, export, or teardown phase. Terminal: DeployCompleted
                  (exporting), DeployFailed, Released (detached), TeardownCompleted,
                  TeardownFailed.
                type: string
              taskRef:
                description: |-
                  The managed object reference ID of the vSphere task the current phase is
                  waiting on. Empty when the phase has nothing outstanding.
                type: string
              vcenterInstanceUUID:
                description: |-
                  The instance UUID of the vCenter the appliance VM was created in. A
                  managed object reference is only unique within one vCenter, so MoRef
                  must not be trusted when this does not match the connected instance.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
